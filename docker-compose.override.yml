# ============================================================
# ANS Management Platform — Docker Compose Override (Development)
# ============================================================
# Layered on top of docker-compose.yml for local development.
# Adds: exposed ports, volume mounts, hot-reload, debug mode.
#
# Usage:
#   docker compose up -d
#   (Docker automatically merges docker-compose.override.yml)
# ============================================================

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI

  minio:
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Console

  keycloak:
    # Dev mode: no TLS checks, theme caching off. Realm still imported from
    # docker/keycloak/realm-oniverse.json on first start (empty keycloak DB).
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"      # Keycloak (login pages + admin console at /auth)

  # Catches every email Keycloak sends in dev (setup, reset password).
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: ans-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"      # Mailpit web UI
    networks:
      - ans-network

  backend:
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "true"
      SQL_ECHO: "true"
      ENVIRONMENT: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app:celery worker --loglevel=debug --concurrency=2 -Q celery,email

  celery-beat:
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app:celery beat --loglevel=info

  flower:
    ports:
      - "5555:5555"

  frontend:
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
