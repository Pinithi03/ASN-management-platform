# ============================================================
# ANS Management Platform — Docker Compose Override (Development)
# ============================================================
# Layered on top of docker-compose.yml for local development.
# Adds: exposed ports, volume mounts, hot-reload, debug mode.
#
# Usage:
#   docker compose up -d
#   (Docker automatically merges docker-compose.override.yml)
# ============================================================

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI

  minio:
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Console

  keycloak:
    command: start-dev
    ports:
      - "8080:8080"

  backend:
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "true"
      SQL_ECHO: "true"
      ENVIRONMENT: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    env_file:
      - .env
    volumes:
      - ./automation:/app
    command: celery -A app.celery_app:celery_app worker --loglevel=debug --concurrency=2

  celery-beat:
    env_file:
      - .env
    volumes:
      - ./automation:/app

  flower:
    ports:
      - "5555:5555"

  frontend:
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
