# ============================================================
# ANS Management Platform — PostgreSQL Configuration
# ============================================================
# Tuned for: 5 tenants, ~400 users, ~2.9 GB Year 1 data
# Container resources: 2 CPU cores, 2 GB RAM (development)
# ============================================================

# -- Connection Settings ------------------------------------
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# -- Memory -------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 4MB
maintenance_work_mem = 128MB

# -- WAL ----------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# -- Query Planner ------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# -- Logging ------------------------------------------------
log_timezone = 'UTC'
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 0

# -- Locale -------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# -- Row-Level Security -------------------------------------
# Allow custom GUC variables for RLS context
# (app.current_company_id, app.current_role, app.current_supplier_id)
row_security = on
