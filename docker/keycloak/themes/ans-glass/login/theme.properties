# Glassmorphic login theme for the ASN Platform realm.
#
# NOTE: this file must live in the theme-type folder (login/), not the theme root,
# or Keycloak ignores it entirely (no parent, no stylesheet, raw message keys).
#
# parent=base gives us Keycloak's message bundles (translations) and every
# page of the login flow. We supply template.ftl and login.ftl ourselves; all
# the other pages (OTP, update password, verify email, authenticator picker,
# errors ...) come from base and are styled through the kc* class names below.
parent=base

# ?v= is a cache-buster: the resource URL is otherwise identical forever, so
# browsers can hold on to an old stylesheet. Bump it after a visual change.
styles=css/glass-style.css?v=3

# ── Class hooks the base templates render into their markup ──────────────
# Base emits `class="${properties.kcInputClass!}"` etc. Anything left unmapped
# renders as an empty class, which is what made the OTP page look unstyled.

kcFormClass=kc-form
kcFormGroupClass=kc-form-group
kcFormSettingClass=kc-form-options
kcContentWrapperClass=kc-content-wrapper
kcFormHeaderClass=kc-card-title
kcFormCardClass=
kcLoginClass=
kcBodyClass=
kcHtmlClass=
kcHeaderClass=
kcHeaderWrapperClass=
kcMarginTopClass=kc-mt

