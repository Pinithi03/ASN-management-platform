# ============================================================
# ANS Management Platform — Docker Compose (Production Base)
# ============================================================
# Root-level production config per KB 10.
# Use with docker-compose.override.yml for development.
#
# Services: postgres, redis, rabbitmq, minio, keycloak,
#           backend, celery-worker, celery-beat, flower,
#           frontend, nginx
#
# Usage:
#   docker compose up -d                  # Production
#   docker compose -f docker-compose.yml \
#     -f docker-compose.override.yml up   # Development
# ============================================================

services:
  # ── Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ans-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ans_platform}
      POSTGRES_USER: ${POSTGRES_USER:-ans_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ans_user} -d ${POSTGRES_DB:-ans_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ans-network

  # ── Cache & Result Backend ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ans-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ans-network

  # ── Message Broker ────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ans-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ans_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ans-network

  # ── Object Storage ────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: ans-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ans_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - ans-network

  # ── Identity Provider ─────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ans-keycloak
    restart: unless-stopped
    command: start --optimized
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ans_platform}
      KC_DB_USERNAME: ${POSTGRES_USER:-ans_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ans-network

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ans-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ans_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ans_platform}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ans_rabbit}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ans_rabbit}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ans_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-oniverse}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ans-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ans-network

  # ── Celery Worker ─────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ans-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery worker --loglevel=info --concurrency=4 -Q celery,email
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ans_rabbit}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ans_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ans_platform}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ans_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-true}
      DEFAULT_COMPANY_ID: ${DEFAULT_COMPANY_ID:-}
      EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL_SECONDS:-120}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ans-network

  # ── Celery Beat (Scheduler) ───────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ans-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery beat --loglevel=info
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ans_rabbit}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL_SECONDS:-120}
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ans-network

  # ── Celery Flower (Monitoring) ────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ans-flower
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery flower --port=5555
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ans_rabbit}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ans-network

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ans-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - ans-network

  # ── Reverse Proxy ─────────────────────────────────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ans-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
      - frontend
    networks:
      - ans-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  ans-network:
    driver: bridge
